<ion-tabs (ionTabsDidChange)="cambiarPestana($event)">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="inicio">
      <ion-icon [name]="pestanaActiva === 'inicio' ? 'home' : 'home-outline'"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="cocinar">
      <ion-icon [name]="pestanaActiva === 'cocinar' ? 'search' : 'search-outline'"></ion-icon>
      <ion-label>Cocinar</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="compras">
      <ion-icon [name]="pestanaActiva === 'compras' ? 'bag' : 'bag-outline'"></ion-icon>
      <ion-label>Compras</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="mi-espacio">
      <ion-icon [name]="pestanaActiva === 'mi-espacio' ? 'person' : 'person-outline'"></ion-icon>
      <ion-label>Mi Espacio</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
